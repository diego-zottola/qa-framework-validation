name: Regression Tests

on:
  workflow_dispatch:
    inputs:
      test_grep:
        description: 'Blank = all regression tests | One: TC0001 | Several: TC0001|TC0002 | Partial title'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Remove QA data left by interrupted runs
        continue-on-error: true
        run: npm run qa -- sweep --older-than 2h
        env:
          ENV: ci
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          GUEST_USER_USERNAME: ${{ secrets.GUEST_USER_USERNAME }}
          GUEST_USER_PASSWORD: ${{ secrets.GUEST_USER_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Run tests
        id: run
        continue-on-error: true
        run: |
          rm -rf allure-results playwright-report
          npx playwright test --project=chromium tests/regression --grep "${TEST_GREP:-.*}"
        env:
          TEST_GREP: ${{ github.event.inputs.test_grep }}
          ENV: ci
          TCM_BASE_URL: ${{ vars.TCM_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          GUEST_USER_USERNAME: ${{ secrets.GUEST_USER_USERNAME }}
          GUEST_USER_PASSWORD: ${{ secrets.GUEST_USER_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Diagnose failures
        if: always() && hashFiles('playwright-report/results.json') != ''
        run: npm run qa -- diagnose
      - name: Suggest selector fixes (suggestions only)
        if: steps.run.outcome == 'failure'
        continue-on-error: true
        run: npm run qa -- heal --verify
        env:
          ENV: ci
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          GUEST_USER_USERNAME: ${{ secrets.GUEST_USER_USERNAME }}
          GUEST_USER_PASSWORD: ${{ secrets.GUEST_USER_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Prepare the publishable report
        if: always() && hashFiles('allure-results/*') != ''
        run: npm run qa -- publish-prepare --suite regression
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          GUEST_USER_USERNAME: ${{ secrets.GUEST_USER_USERNAME }}
          GUEST_USER_PASSWORD: ${{ secrets.GUEST_USER_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Upload the publishable report
        if: always() && hashFiles('qa-publish/meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: site-run-regression
          path: qa-publish/
          retention-days: 15
      - name: Generate the full Allure report
        if: always() && github.event.repository.private == true && hashFiles('allure-results/*') != ''
        run: npx allure generate allure-results --clean -o allure-report
      - name: Upload the full reports and traces
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: regression-full-reports
          path: |
            playwright-report/
            allure-report/
            test-results/
          retention-days: 15
          if-no-files-found: ignore
      - name: Keep the job red when tests failed
        if: steps.run.outcome == 'failure'
        run: exit 1
